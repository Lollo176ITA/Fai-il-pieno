# Build, test e pubblicazione dell'APK.
#
# - Ogni push su main e ogni pull request: test, lint e APK scaricabile come artifact.
# - Un tag vN.N.N (es. v0.2.0): in più crea una GitHub Release con l'APK allegato.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ORS_API_KEY                 chiave OpenRouteService/HeiGIT (senza, percorsi e indirizzi non funzionano)
#   RELEASE_KEYSTORE_BASE64     keystore di firma in base64
#   RELEASE_KEYSTORE_PASSWORD   password del keystore
#   RELEASE_KEY_ALIAS           alias della chiave
#   RELEASE_KEY_PASSWORD        password della chiave
# Senza il keystore si pubblica l'APK di debug, installabile ma non aggiornabile tra una build e l'altra.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      # Il numero dell'esecuzione cresce sempre: ogni APK pubblicato può aggiornare il precedente.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Piattaforma Android 37
        # Da Android 16 il pacchetto include la versione minore: "android-37" non esiste.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Test e lint
        run: ./gradlew test lintDebug

      - name: Keystore di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore non configurato: pubblico l'APK di debug."
          fi

      - name: APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/fai-il-pieno-${VERSION_NAME}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/fai-il-pieno-${VERSION_NAME}-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fai-il-pieno-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Fai il pieno $VERSION_NAME" --generate-notes

      - name: Rimuove il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
